name: Bug
description: A command, the daemon, or the dashboard did something wrong
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Include the parts of devdeck.config.ts that matter. Leave out secrets and database URLs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: npm list -g @jaisheel41/devdeck, or the git commit if you are on a checkout.
      placeholder: 0.1.3
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v20.16.0
